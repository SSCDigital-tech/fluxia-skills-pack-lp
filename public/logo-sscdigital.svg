<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90">
  <defs>
    <!-- Cyan gradient (S1) -->
    <linearGradient id="gc" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#7DD3FC"/>
      <stop offset="50%"  stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <!-- Indigo gradient (S2) -->
    <linearGradient id="gi" x1="90%" y1="100%" x2="10%" y2="0%">
      <stop offset="0%"   stop-color="#1E3A8A"/>
      <stop offset="50%"  stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <!-- Brand horizontal gradient -->
    <linearGradient id="gbrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <!-- Clip for bottom half (for interlocking depth illusion) -->
    <clipPath id="clip-bot">
      <rect x="0" y="50" width="100" height="50"/>
    </clipPath>
  </defs>
  
  <rect x="8" y="8" width="74" height="74" rx="16" fill="#EEF2FF"/>
  <g transform="translate(8,8) scale(0.74)">
    <path d="M 66,18 L 34,18 C 27,18 27,56 34,56 L 66,44 C 73,44 73,82 66,82 L 34,82" fill="none" stroke="url(#gi)"
          stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 34,18 L 66,18 C 73,18 73,44 66,44 L 34,56 C 27,56 27,82 34,82 L 66,82" fill="none" stroke="url(#gc)"
          stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 66,18 L 34,18 C 27,18 27,56 34,56 L 66,44 C 73,44 73,82 66,82 L 34,82" fill="none" stroke="url(#gi)"
          stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
          clip-path="url(#clip-bot)"/></g>
  <text x="98" y="40" font-family="Inter,'SF Pro Display','Segoe UI',system-ui,sans-serif"
        font-size="26" font-weight="700" letter-spacing="2" fill="#0F1E3D">SSC</text>
  <text x="98" y="63" font-family="Inter,'Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="400" letter-spacing="5" fill="#64748B">DIGITAL</text>
  <rect x="98" y="70" width="150" height="2" rx="1" fill="url(#gbrand)" opacity="0.5"/>
</svg>