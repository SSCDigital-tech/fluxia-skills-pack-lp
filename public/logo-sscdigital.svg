<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90">
  <defs>
    <linearGradient id="gc" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#7DD3FC"/>
      <stop offset="50%"  stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="gi" x1="90%" y1="100%" x2="10%" y2="0%">
      <stop offset="0%"   stop-color="#1E3A8A"/>
      <stop offset="50%"  stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="gbrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <clipPath id="clip-bot">
      <rect x="0" y="50" width="100" height="50"/>
    </clipPath>
  </defs>

  <!-- Icon box — subtle glass para contrastar com dark bg -->
  <rect x="8" y="8" width="74" height="74" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- S-shaped interlock icon -->
  <g transform="translate(8,8) scale(0.74)">
    <path d="M 66,18 L 34,18 C 27,18 27,56 34,56 L 66,44 C 73,44 73,82 66,82 L 34,82" fill="none" stroke="url(#gi)"
          stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 34,18 L 66,18 C 73,18 73,44 66,44 L 34,56 C 27,56 27,82 34,82 L 66,82" fill="none" stroke="url(#gc)"
          stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 66,18 L 34,18 C 27,18 27,56 34,56 L 66,44 C 73,44 73,82 66,82 L 34,82" fill="none" stroke="url(#gi)"
          stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
          clip-path="url(#clip-bot)"/>
  </g>

  <!-- SSC — branco, bold -->
  <text x="100" y="42" font-family="Inter,'SF Pro Display','Segoe UI',system-ui,sans-serif"
        font-size="28" font-weight="700" letter-spacing="2" fill="#FFFFFF">SSC</text>
  <!-- DIGITAL — cinza claro, legível em dark -->
  <text x="100" y="63" font-family="Inter,'Segoe UI',system-ui,sans-serif"
        font-size="13" font-weight="500" letter-spacing="5.5" fill="#94A3B8">DIGITAL</text>
  <!-- gradient underline -->
  <rect x="100" y="70" width="148" height="1.5" rx="1" fill="url(#gbrand)" opacity="0.75"/>
</svg>
